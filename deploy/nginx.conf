# /api 限流：每 IP 每秒 2 次、允许突发 10（防公网刷接口；与后端 RATE_LIMIT_PER_MINUTE 双保险）
limit_req_zone $binary_remote_addr zone=signbridge_api:10m rate=2r/s;

server {
    listen 80;
    server_name _;
    client_max_body_size 10m;

    root /usr/share/nginx/html;
    index index.html;

    # 前端静态资源
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 反向代理后端（同源请求 /api/*，关闭缓冲以保证 SSE 流式直出）
    location /api/ {
        limit_req zone=signbridge_api burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 60s;
    }
}
